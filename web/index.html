<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentLighthouse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    .score-animate { animation: countUp 1.2s ease-out forwards; }
    @keyframes countUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .iframe-fallback { display: none; }
    .iframe-loaded + .iframe-fallback { display: none; }
    .diagnosis-severity-high { border-left-color: #ef4444; }
    .diagnosis-severity-medium { border-left-color: #f59e0b; }
    .diagnosis-severity-low { border-left-color: #22c55e; }
    @media (max-width: 390px) {
      .container { padding: 0.75rem; }
      .task-card { padding: 0.75rem; }
      .diagnosis-card { padding: 0.75rem; }
    }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="container max-w-4xl mx-auto p-4">
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900">AgentLighthouse</h1>
      <p class="text-gray-600 mt-1">Test if AI agents can use your website</p>
    </header>

    <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
      <form id="audit-form" class="flex flex-col sm:flex-row gap-3">
        <div class="flex-1 flex gap-2">
          <input
            id="url-input"
            type="url"
            placeholder="https://example.com"
            class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            required
          >
          <button
            type="submit"
            id="submit-btn"
            class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
          >
            Start Audit
          </button>
        </div>
      </form>
      <div class="flex gap-2 mt-3">
        <button
          id="sample-shop"
          type="button"
          class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition text-sm"
        >
          Try a sample shop
        </button>
        <button
          id="sample-saas"
          type="button"
          class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition text-sm"
        >
          Try a sample SaaS
        </button>
      </div>
      <p id="error-msg" class="text-red-600 mt-2 hidden"></p>
    </div>

    <div id="stages" class="space-y-4" hidden>
      <div id="stage-signals" class="bg-white rounded-lg shadow-sm p-6 hidden">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-semibold">Machine-Readability Signals</h2>
          <span id="signals-summary" class="text-sm text-gray-500"></span>
        </div>
        <div id="signals-grid" class="grid grid-cols-2 md:grid-cols-3 gap-3"></div>
      </div>

      <div id="stage-tasks" class="bg-white rounded-lg shadow-sm p-6 hidden">
        <h2 class="text-lg font-semibold mb-4">Tasks</h2>
        <div id="task-cards" class="space-y-3"></div>
      </div>

      <div id="stage-diagnose" class="bg-white rounded-lg shadow-sm p-6 hidden">
        <h2 class="text-lg font-semibold mb-4">AI Diagnoses</h2>
        <div id="diagnoses" class="space-y-3"></div>
      </div>

      <div id="stage-score" class="bg-white rounded-lg shadow-sm p-6 hidden">
        <h2 class="text-lg font-semibold mb-4">Score</h2>
        <div class="grid grid-cols-3 gap-4">
          <div class="text-center p-4 bg-blue-50 rounded-lg">
            <div id="score-total" class="text-4xl font-bold text-blue-600 score-animate">0</div>
            <div class="text-sm text-gray-600">Total</div>
          </div>
          <div class="text-center p-4 bg-green-50 rounded-lg">
            <div id="score-grade" class="text-4xl font-bold text-green-600 score-animate">F</div>
            <div class="text-sm text-gray-600">Grade</div>
          </div>
          <div class="text-center p-4 bg-purple-50 rounded-lg">
            <div id="agent-tax" class="text-4xl font-bold text-purple-600 score-animate">$0.00</div>
            <div class="text-sm text-gray-600">Agent Tax / task</div>
          </div>
        </div>
        <div class="mt-4 grid grid-cols-3 gap-4 text-sm text-gray-600">
          <div class="text-center p-3 bg-gray-50 rounded">
            <div id="score-success" class="font-bold text-blue-600">0</div>
            <div>Success</div>
          </div>
          <div class="text-center p-3 bg-gray-50 rounded">
            <div id="score-efficiency" class="font-bold text-green-600">0</div>
            <div>Efficiency</div>
          </div>
          <div class="text-center p-3 bg-gray-50 rounded">
            <div id="score-readability" class="font-bold text-purple-600">0</div>
            <div>Readability</div>
          </div>
        </div>
      </div>

      <div id="stage-peers" class="bg-white rounded-lg shadow-sm p-6 hidden">
        <h2 class="text-lg font-semibold mb-4">Competitors</h2>
        <div id="peers-list" class="space-y-2"></div>
      </div>
    </div>

    <div id="done-view" class="bg-white rounded-lg shadow-sm p-6 hidden">
      <h2 class="text-lg font-semibold mb-4">Audit Complete</h2>
      <div class="flex flex-wrap gap-3">
        <button id="new-audit" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg hover:bg-gray-300 transition">
          New Audit
        </button>
        <button id="view-report" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition hidden">
          View Full Report
        </button>
        <button id="view-leaderboard" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition hidden">
          View Leaderboard
        </button>
      </div>
    </div>

    <div id="leaderboard-view" class="bg-white rounded-lg shadow-sm p-6 hidden">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold">Leaderboard</h2>
        <button id="back-from-leaderboard" class="px-3 py-1 text-sm text-gray-600 hover:text-gray-900">← Back</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left text-gray-500 border-b">
              <th class="pb-2">Rank</th>
              <th class="pb-2">Domain</th>
              <th class="pb-2">Type</th>
              <th class="pb-2">Score</th>
              <th class="pb-2">Grade</th>
              <th class="pb-2">Agent Tax</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body" class="text-gray-700"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="app.js?v=5"></script>
</body>
</html>
