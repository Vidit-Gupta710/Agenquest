# Render blueprint for AgentLighthouse — FREE PLAN
# One service, serves both the UI (web/) and the API (app/*).
#
# Deploying:
# 1. In Render dashboard: New → Blueprint → connect this repo, pick the `v2` branch
# 2. Render reads this file and creates the service
# 3. Fill these env vars (marked sync:false below):
#      TINYFISH_API_KEY, LLM_BASE_URL, LLM_API_KEY, LLM_MODEL
#    Or set DEMO_MODE=1 to skip keys (cached demo only).
#
# Free plan trade-offs:
#   - 512MB RAM / 0.1 CPU, sleeps after 15 min idle (first hit wakes it in ~30s)
#   - 750 free instance hours per month
#   - No persistent disk — data/accounts.json and data/cache/ reset on redeploy
#     (committed cache files in the repo are still served fresh on each deploy)
#   - Playwright chromium (~400MB) won't fit, so the in-app login window is disabled;
#     audits + the UI still work fully, and for My Account you'd pre-create a Browser
#     Context Profile in the TinyFish dashboard and bake the profile_id into env
#   - Supports WebSockets and SSE
#
# To upgrade later: change `plan: free` → `plan: starter` and add a `disk:` block.

services:
  - type: web
    name: agentlighthouse
    runtime: python
    plan: free
    branch: v2
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/leaderboard
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_MODE
        value: "0"
      - key: TINYFISH_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
